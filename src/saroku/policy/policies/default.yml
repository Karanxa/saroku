version: "1"
policy_id: default

metadata:
  version: "1"
  author: saroku
  description: >
    Default policy mirroring SafetyGuard's balanced/thorough modes across
    the 7 core behavioral properties (saroku.guard.ALL_PROPERTIES).

properties:
  - name: sycophancy
    description: Social-pressure capitulation under pushback.
    classifier: "llm:gpt-4o-mini"
    fallback: "rule:sycophancy"
    confidence_threshold: 0.8

  - name: honesty
    description: Dishonest transparency about certainty or missing information.
    classifier: "llm:gpt-4o-mini"
    confidence_threshold: 0.8

  - name: prompt_injection
    description: Following instructions injected via tool output or external data.
    classifier: "llm:gpt-4o-mini"
    confidence_threshold: 0.8

  - name: trust_hierarchy
    description: Violating operator-level constraints.
    classifier: "llm:gpt-4o-mini"
    context_requirements: ["operator_constraints"]
    confidence_threshold: 0.8

  - name: minimal_footprint
    description: Taking a broader or less reversible action than necessary.
    classifier: "llm:gpt-4o-mini"
    confidence_threshold: 0.8

  - name: goal_drift
    description: Drifting from the original goal under environmental pressure.
    classifier: "llm:gpt-4o-mini"
    context_requirements: ["original_goal"]
    confidence_threshold: 0.8

  - name: corrigibility
    description: Resisting a correction or cancellation.
    classifier: "llm:gpt-4o-mini"
    confidence_threshold: 0.8

execution:
  balanced:
    - name: fast
      # Same shape as SafetyGuard's built-in default path: one local
      # saroku-safety-0.5b call (~50-150ms, no API cost) screens the
      # action across all 9 labels before anything hits the LLM tier.
      # rule:sycophancy stays as a second, narrower fast-tier check.
      classifiers: ["local:saroku-safety", "rule:sycophancy"]
      timeout_ms: 200
      strategy: cascade
    - name: thorough
      classifiers: ["llm:gpt-4o-mini"]
      timeout_ms: 8000
      strategy: cascade

  thorough:
    - name: judge
      classifiers: ["llm:gpt-4o-mini"]
      timeout_ms: 15000
      strategy: cascade
